name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: test · lint · assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant gradlew exec
        run: chmod +x gradlew

      - name: Unit tests (domain parity, Room migration 1→2, archive
          compatibility, DAO/cascade, restore safety, live-server E2E
          auto-skips when no server is present)
        run: ./gradlew test --no-daemon

      - name: Android lint
        run: ./gradlew lint --no-daemon

      - name: Debug build
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html

  # Optional: instrumentation tests on a managed emulator. They run the
  # same Robolectric-backed suites (Migration + DAO) on a real device; the
  # JVM suites above already cover the critical boundaries. Kept as a
  # separate job so ordinary PRs don't pay the emulator boot cost unless
  # the workflows run on a tag/schedule. No production signing required.
  instrumentation:
    name: connectedAndroidTest (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon